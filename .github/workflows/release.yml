name: release

# Chay khi push tag dang v*.*.* (vd v1.0.0). Gia dinh src-tauri/gen/android/
# DA CO SAN trong repo (tu workflow setup-android.yml chay 1 lan duy nhat
# truoc do) — workflow nay khong tu init lai.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pydinary-apk
        uses: actions/checkout@v4

      - name: Kiem tra da co src-tauri/gen/android chua
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "::error::src-tauri/gen/android/ chua ton tai. Chay workflow 'setup-android' (tab Actions -> setup-android -> Run workflow) truoc, roi tag lai."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        run: |
          rustup update stable
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Install frontend deps
        run: npm ci

      # `tauri icon` tu cap nhat luon icon trong
      # src-tauri/gen/android/app/src/main/res/mipmap-*/ vi gen/android/
      # da ton tai san (khac lan chay dau trong setup-android.yml).
      - name: Gen icons
        run: npm run gen-icons

      # Doc chinh xac theo huong dan chinh thuc cua Tauri
      # (https://v2.tauri.app/distribute/sign/android/) — file
      # keystore.properties nay KHONG duoc commit (gen/android/ da co san
      # .gitignore rieng loai tru no).
      - name: Setup Android signing
        working-directory: src-tauri/gen/android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          echo "keyAlias=$ANDROID_KEY_ALIAS" > keystore.properties
          echo "password=$ANDROID_KEY_PASSWORD" >> keystore.properties
          base64 -d <<< "$ANDROID_KEY_BASE64" > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      # --apk (khong --split-per-abi) = 1 file .apk "universal" duy nhat,
      # chay duoc tren moi kien truc CPU — de nguoi tai tren GitHub khong
      # phai tu chon dung file khop may minh.
      - name: Build APK
        run: npx tauri android build --apk

      - name: Tim file APK vua build
        id: apk
        run: |
          APK_PATH=$(find src-tauri/gen/android -name "*-universal-release.apk" | head -n1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find src-tauri/gen/android -path "*/release/*.apk" | head -n1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "::error::Khong tim thay file .apk nao sau khi build."
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Tim thay: $APK_PATH"

      - name: Tao/cap nhat draft release + dinh APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Pydinary ${{ github.ref_name }} (Android)"
          draft: true
          prerelease: false
          files: ${{ steps.apk.outputs.path }}
